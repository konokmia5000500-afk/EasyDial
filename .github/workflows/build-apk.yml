name: Build 64-bit Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project & detect Gradle version
        id: prep
        run: |
          set -e
          for z in *.zip; do
            if [ -f "$z" ]; then
              unzip -o "$z" -d extracted_project
            fi
          done

          SETTINGS_FILE=$(find . -maxdepth 4 -name "settings.gradle.kts" -o -name "settings.gradle" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "settings.gradle / settings.gradle.kts not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          WRAPPER_PROPS="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"
          if [ -f "$WRAPPER_PROPS" ]; then
            GRADLE_VER=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)+' "$WRAPPER_PROPS" | head -n 1 | sed 's/gradle-//')
            echo "gradle_version=$GRADLE_VER" >> "$GITHUB_OUTPUT"
            echo "Detected Gradle version from wrapper: $GRADLE_VER"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.prep.outputs.gradle_version || 'wrapper' }}

      - name: Generate debug.keystore if missing
        run: |
          set -e
          PROJECT_DIR="${{ steps.prep.outputs.project_dir }}"
          mkdir -p "$HOME/.android"

          KEYSTORE_PATHS=(
            "$PROJECT_DIR/debug.keystore"
            "$HOME/.android/debug.keystore"
          )

          for KS in "${KEYSTORE_PATHS[@]}"; do
            if [ ! -f "$KS" ]; then
              keytool -genkeypair \
                -v \
                -keystore "$KS" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          done

      - name: Build single 64-bit (arm64-v8a) debug APK
        run: |
          gradle -p "${{ steps.prep.outputs.project_dir }}" assembleDebug -Pandroid.injected.abi=arm64-v8a

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-debug-apk
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
